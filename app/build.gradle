plugins { id 'com.android.application' }
android {
    namespace 'cn.luyin.player'
    compileSdk 35
    defaultConfig { applicationId 'cn.luyin.player'; minSdk 29; targetSdk 35; versionCode 5; versionName '1.4.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs { debug { storeFile rootProject.file('.toolchain/debug.keystore') } }
    buildTypes { release { minifyEnabled false } }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'user.home', rootProject.file('.toolchain').absolutePath
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            systemProperty 'maven.repo.local', rootProject.file('.toolchain/robolectric-m2').absolutePath
        }
    }
}
dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-session:1.8.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
